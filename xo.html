<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>X VS O | The Arena</title>

    
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#020308] text-white overflow-hidden">


    

    <main
        id="startScreen"
        class="relative min-h-screen w-full overflow-hidden
        bg-[#020308]
        flex items-center justify-center">


        

        <img
            src="background-one.png.png"
            alt=""
            class="absolute inset-0
            w-full h-full
            object-cover
            opacity-100
            pointer-events-none"
        >


        
        

        <div
            class="absolute inset-0
            bg-black/20">
        </div>


       

        <div
            class="absolute
            left-[-180px]
            top-[25%]
            w-[550px]
            h-[550px]
            rounded-full
            bg-purple-700/10
            blur-[120px]
            pointer-events-none">
        </div>


       

        <div
            class="absolute
            right-[-180px]
            top-[25%]
            w-[550px]
            h-[550px]
            rounded-full
            bg-blue-700/10
            blur-[120px]
            pointer-events-none">
        </div>


        

        <div
            class="absolute inset-0
            opacity-[0.055]
            pointer-events-none
            bg-[linear-gradient(to_right,#ffffff_1px,transparent_1px),linear-gradient(to_bottom,#ffffff_1px,transparent_1px)]
            bg-[size:48px_48px]">
        </div>


       

        <div
            class="absolute
            inset-[34px]
            md:inset-[32px]
            border
            border-white/[0.08]
            pointer-events-none">
        </div>


      

        <div
            class="absolute
            left-[33px]
            top-[34px]
            w-9
            h-9
            border-l-2
            border-t-2
            border-purple-500/80
            pointer-events-none">
        </div>


        

        <div
            class="absolute
            right-[33px]
            top-[34px]
            w-9
            h-9
            border-r-2
            border-t-2
            border-blue-500/80
            pointer-events-none">
        </div>


        

        <div
            class="absolute
            left-[33px]
            bottom-[34px]
            w-9
            h-9
            border-l-2
            border-b-2
            border-purple-500/80
            pointer-events-none">
        </div>


        

        <div
            class="absolute
            right-[33px]
            bottom-[34px]
            w-9
            h-9
            border-r-2
            border-b-2
            border-blue-500/80
            pointer-events-none">
        </div>



       

        <div
            id="gameInfo"
            class="absolute
            left-[70px]
            top-[65px]
            z-20
            opacity-0
            -translate-x-8
            transition-all
            duration-1000">


            <p
                class="text-[11px]
                md:text-sm
                tracking-[0.45em]
                text-gray-300
                uppercase">

                Game 01

            </p>


            <p
                class="mt-2
                text-[9px]
                md:text-[10px]
                tracking-[0.3em]
                text-gray-500
                uppercase">

                Player VS Player

            </p>

        </div>



        

        <div
            id="systemStatus"
            class="absolute
            right-[65px]
            top-[65px]
            z-20
            flex
            items-center
            gap-3
            opacity-0
            translate-x-8
            transition-all
            duration-1000">


            <span
                class="w-2.5
                h-2.5
                rounded-full
                bg-green-400
                shadow-[0_0_12px_rgba(74,222,128,0.8)]
                animate-pulse">
            </span>


            <span
                class="text-[9px]
                md:text-[10px]
                tracking-[0.3em]
                text-gray-400
                uppercase">

                System Online

            </span>

        </div>



       

        <div
            id="mainContent"
            class="relative
            z-10
            w-full
            max-w-5xl
            text-center
            px-6
            opacity-0
            translate-y-8
            transition-all
            duration-1000">


          

            <p
                class="text-gray-400
                text-[10px]
                md:text-xs
                tracking-[0.75em]
                uppercase
                mb-12">

                The Ultimate Duel

            </p>



            
           

            <div
                class="flex
                items-center
                justify-center
                gap-7
                md:gap-12">


                <!-- X -->

                <div
                    id="mainX"
                    class="text-[110px]
                    sm:text-[140px]
                    md:text-[180px]
                    font-black
                    leading-none
                    text-purple-500
                    drop-shadow-[0_0_25px_rgba(168,85,247,0.75)]
                    transition-all
                    duration-300
                    hover:scale-110
                    hover:drop-shadow-[0_0_55px_rgba(168,85,247,1)]">

                    X

                </div>



               

                <div
                    class="flex
                    flex-col
                    items-center
                    gap-3">


                    <span
                        class="w-16
                        h-px
                        bg-gray-600">
                    </span>


                    <span
                        class="text-gray-400
                        text-xl
                        md:text-2xl
                        font-medium
                        tracking-[0.15em]">

                        VS

                    </span>


                    <span
                        class="w-16
                        h-px
                        bg-gray-600">
                    </span>


                </div>



                

                <div
                    id="mainO"
                    class="text-[110px]
                    sm:text-[140px]
                    md:text-[180px]
                    font-black
                    leading-none
                    text-blue-500
                    drop-shadow-[0_0_25px_rgba(59,130,246,0.75)]
                    transition-all
                    duration-300
                    hover:scale-110
                    hover:drop-shadow-[0_0_55px_rgba(59,130,246,1)]">

                    O

                </div>


            </div>



            

            <div
                class="flex
                items-center
                justify-center
                gap-5
                mt-10">


                <span
                    class="h-[2px]
                    w-16
                    md:w-20
                    bg-purple-500
                    shadow-[0_0_10px_rgba(168,85,247,0.7)]">
                </span>


                <h2
                    class="text-lg
                    md:text-2xl
                    tracking-[0.45em]
                    uppercase
                    text-gray-200">

                    The Arena

                </h2>


                <span
                    class="h-[2px]
                    w-16
                    md:w-20
                    bg-blue-500
                    shadow-[0_0_10px_rgba(59,130,246,0.7)]">
                </span>


            </div>



            

            <p
                class="mt-10
                text-gray-400
                text-[10px]
                md:text-xs
                tracking-[0.5em]
                uppercase">

                Only One Can Win

            </p>



           

            <button
                id="enterBtn"
                type="button"
                class="group
                relative
                mx-auto
                mt-8
                w-[360px]
                md:w-[490px]
                h-[72px]
                md:h-[90px]
                p-[1px]
                bg-gradient-to-r
                from-purple-500
                via-gray-300
                to-blue-500
                [clip-path:polygon(0_18px,18px_0,calc(100%-18px)_0,100%_18px,100%_calc(100%-18px),calc(100%-18px)_100%,18px_100%,0_calc(100%-18px))]
                transition-all
                duration-500
                hover:scale-[1.02]
                hover:shadow-[0_0_35px_rgba(168,85,247,0.15)]">


               

                <span
                    class="relative
                    flex
                    w-full
                    h-full
                    items-center
                    justify-center
                    gap-6
                    bg-[#020308]/95
                    text-white
                    overflow-hidden
                    [clip-path:polygon(0_17px,17px_0,calc(100%-17px)_0,100%_17px,100%_calc(100%-17px),calc(100%-17px)_100%,17px_100%,0_calc(100%-17px))]">


                    

                    <span
                        class="absolute
                        top-0
                        left-0
                        w-[45px]
                        h-[2px]
                        bg-purple-500
                        shadow-[0_0_10px_rgba(168,85,247,0.8)]
                        transition-all
                        duration-500
                        group-hover:w-[80px]">
                    </span>


                    

                    <span
                        class="absolute
                        bottom-0
                        right-0
                        w-[45px]
                        h-[2px]
                        bg-blue-500
                        shadow-[0_0_10px_rgba(59,130,246,0.8)]
                        transition-all
                        duration-500
                        group-hover:w-[80px]">
                    </span>


                   

                    <span
                        class="relative
                        z-10
                        text-xs
                        md:text-sm
                        font-bold
                        tracking-[0.4em]
                        uppercase
                        transition-all
                        duration-300
                        group-hover:tracking-[0.5em]">

                        START BATTLE

                    </span>


                    

                    <span
                        class="relative
                        z-10
                        text-xl
                        md:text-2xl
                        font-light
                        transition-all
                        duration-300
                        group-hover:translate-x-2">

                        →

                    </span>


                </span>

            </button>



           

            <div
                class="flex
                items-center
                justify-center
                gap-4
                mt-8">


                <span
                    class="w-2
                    h-2
                    rounded-full
                    bg-purple-500
                    shadow-[0_0_10px_rgba(168,85,247,0.8)]
                    animate-pulse">
                </span>


                <span
                    class="text-[9px]
                    md:text-[10px]
                    tracking-[0.45em]
                    text-gray-500
                    uppercase">

                    Ready To Play

                </span>


                <span
                    class="w-2
                    h-2
                    rounded-full
                    bg-blue-500
                    shadow-[0_0_10px_rgba(59,130,246,0.8)]
                    animate-pulse">
                </span>


            </div>


        </div>



        

        <div
            class="absolute
            left-[70px]
            bottom-[65px]
            text-[9px]
            md:text-[10px]
            tracking-[0.35em]
            text-gray-600
            uppercase">

            X & O / 001

        </div>



        

        <div
            class="absolute
            right-[65px]
            bottom-[65px]
            text-[9px]
            md:text-[10px]
            tracking-[0.35em]
            text-gray-600
            uppercase">

            Enter The Arena

        </div>


    </main>



   

    <section
        id="characterScreen"
        class="hidden
        min-h-screen
        bg-[#020308]
        text-white
        items-center
        justify-center">


        <div
            class="text-center">


            <p
                class="text-purple-500
                tracking-[0.5em]
                text-xs
                uppercase">

                Next Stage

            </p>


            <h2
                class="text-5xl
                md:text-7xl
                font-black
                mt-4">

                CHOOSE YOUR WARRIOR

            </h2>


        </div>


    </section>



   

    <script>


        
        const mainContent =
            document.getElementById("mainContent");


        const gameInfo =
            document.getElementById("gameInfo");


        const systemStatus =
            document.getElementById("systemStatus");


        const enterBtn =
            document.getElementById("enterBtn");


        const startScreen =
            document.getElementById("startScreen");


        const characterScreen =
            document.getElementById("characterScreen");



        

        window.addEventListener(
            "load",
            function () {


                setTimeout(
                    function () {

                        mainContent.classList.remove(
                            "opacity-0",
                            "translate-y-8"
                        );

                    },
                    250
                );


                setTimeout(
                    function () {

                        gameInfo.classList.remove(
                            "opacity-0",
                            "-translate-x-8"
                        );


                        systemStatus.classList.remove(
                            "opacity-0",
                            "translate-x-8"
                        );

                    },
                    600
                );

            }
        );



        

        enterBtn.addEventListener(
            "click",
            function () {


                startScreen.classList.add(
                    "opacity-0",
                    "scale-105",
                    "transition-all",
                    "duration-700"
                );


                setTimeout(
                    function () {

                        startScreen.classList.add(
                            "hidden"
                        );


                        characterScreen.classList.remove(
                            "hidden"
                        );


                        characterScreen.classList.add(
                            "flex"
                        );

                    },
                    700
                );

            }
        );


    </script>


</body>

</html>
